# Dev override: publish db + redis so the API and worker can run on the host
# (via `make server` / `pnpm --dir server start:dev`) with hot reload.
# Use alongside the base file:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up -d db redis
services:
  db:
    ports:
      - '${POSTGRES_PORT:-55432}:5432'
  redis:
    ports:
      - '${REDIS_PORT:-56379}:6379'

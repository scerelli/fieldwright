name: ibis

services:
  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    image: ghcr.io/scerelli/ibis-server:local
    restart: unless-stopped
    ports:
      - '${API_PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ibis}
      REDIS_URL: redis://redis:6379
      # Optional S3-compatible Evidence storage: each is passed only when set in
      # the host environment (infra/.env), so the volume backend stays the
      # default. Set MEDIA_STORAGE_BACKEND=s3 to switch (see infra/.env.example).
      MEDIA_STORAGE_BACKEND:
      MEDIA_S3_ENDPOINT:
      MEDIA_S3_REGION:
      MEDIA_S3_BUCKET:
      MEDIA_S3_ACCESS_KEY_ID:
      MEDIA_S3_SECRET_ACCESS_KEY:
      MEDIA_S3_FORCE_PATH_STYLE:
      MEDIA_S3_PRESIGN_EXPIRY_SECONDS:
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../server
      dockerfile: Dockerfile
    image: ghcr.io/scerelli/ibis-server:local
    command: ['node', 'dist/worker.js']
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ibis}
      REDIS_URL: redis://redis:6379
      # Optional S3-compatible Evidence storage: each is passed only when set in
      # the host environment (infra/.env), so the volume backend stays the
      # default. Set MEDIA_STORAGE_BACKEND=s3 to switch (see infra/.env.example).
      MEDIA_STORAGE_BACKEND:
      MEDIA_S3_ENDPOINT:
      MEDIA_S3_REGION:
      MEDIA_S3_BUCKET:
      MEDIA_S3_ACCESS_KEY_ID:
      MEDIA_S3_SECRET_ACCESS_KEY:
      MEDIA_S3_FORCE_PATH_STYLE:
      MEDIA_S3_PRESIGN_EXPIRY_SECONDS:
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ibis}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ibis}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db:
  media:
